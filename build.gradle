plugins {
  id "java"
  id "idea"
  id "maven-publish"
  id "net.neoforged.gradle.userdev" version "7.0.170"
  id "com.github.johnrengelman.shadow" version "7.1.2"
  id "me.modmuss50.mod-publish-plugin" version "0.7.4"
}

archivesBaseName = mod_id
group = mod_group_id

String buildNumber = System.getenv("GITHUB_RUN_NUMBER")
version = "${mod_version}-mc${minecraft_version}" + (buildNumber != null ? "-${buildNumber}" : "")

// mod gradle
runs {
  configureEach {
    systemProperty "forge.logging.markers", "REGISTRIES"
    systemProperty "forge.logging.console.level", "debug"

    modSource project.sourceSets.main
  }

  client {
    systemProperty "forge.enabledGameTestNamespaces", project.mod_id
  }

  server {
    systemProperty "forge.enabledGameTestNamespaces", project.mod_id
    argument "--nogui"
  }

  gameTestServer {
    systemProperty "forge.enabledGameTestNamespaces", project.mod_id
  }

  data {
    argument "--all"
    arguments.addAll "--mod", project.mod_id
    arguments.addAll "--output", file("src/generated/resources/").getAbsolutePath()
    arguments.addAll "--existing", file("src/main/resources/").getAbsolutePath()
    arguments.addAll "--existing-mod", "create"
  }
}

configurations {
  additional
  implementation.extendsFrom additional
  runtimeClasspath.extendsFrom localRuntime
}

// dependencies
repositories {
  mavenCentral()
  maven { url = "https://maven.createmod.net" } // create, flywheel, ponder
  maven { url = "https://maven.ithundxr.dev/snapshots" } // registrate
  maven { url = "https://maven.mrjulsen.net" } // crn, dragonlib
  maven { url = "https://api.modrinth.com/maven" } // snr
  maven { url = "https://maven.architectury.dev" } // arch api
  maven { url = "https://raw.githubusercontent.com/Fuzss/modresources/main/maven" } // forge config api port
}

dependencies {
  // minecraft
  implementation("net.neoforged:neoforge:${neo_version}")

  // create
  implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
  implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
  compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
  runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
  implementation("com.tterrag.registrate:Registrate:${registrate_version}")

  // compat
  implementation("maven.modrinth:create-steam-n-rails-1.21.1:${snr_version}")
  implementation("de.mrjulsen.crn:createrailwaysnavigator-neoforge:${minecraft_version}-${crn_version}")
  implementation("de.mrjulsen.mcdragonlib:dragonlib-neoforge:${minecraft_version}-${dragonlib_version}")

  // additional libs
  additional(shadow("javazoom:jlayer:${jlayer_version}"))
}

// publishing
publishing {
  publications {
    mavenJava(MavenPublication) {
      artifactId = mod_id + "-neoforge"
      from components.java
    }
  }

  repositories {
    maven {
      name = "Github"
      url = "file://${System.getProperty('user.home')}/Documents/purplecreatemaven"
    }
  }
}

publishMods {
  type = STABLE
  file = tasks.jar.archiveFile
  version.set(mod_version)
  changelog = file("CHANGELOG.md").text

  curseforge {
    displayName = "${mod_version} for Neoforge 1.21.1"
    projectId = curseforge_id
    accessToken = System.getenv("CURSEFORGE_TOKEN")
    minecraftVersions.add(minecraft_version)
    modLoaders.add("neoforge")

    requires("create")
    requires("create-railways-navigator")
  }

  modrinth {
    displayName = "${mod_version} for Neoforge 1.21.1"
    projectId = modrinth_id
    accessToken = System.getenv("MODRINTH_TOKEN")
    minecraftVersions.add(minecraft_version)
    modLoaders.add("neoforge")

    requires("create")
    requires("create-railways-navigator")
  }
}

// neoforge.mods.toml
tasks.withType(ProcessResources).configureEach {
  var replaceProperties = [
    mod_id: mod_id,
    mod_version: mod_version,
    neo_version_range: neo_version_range,
    minecraft_version: minecraft_version,
    create_version_range: create_version_range,
    crn_version_range: crn_version_range
  ]

  inputs.properties replaceProperties
  filesMatching(['META-INF/neoforge.mods.toml']) {
    expand replaceProperties
  }
}

// java
java.toolchain.languageVersion = JavaLanguageVersion.of(21)

shadowJar {
  archiveClassifier = "dev-shadow"
  relocate("javazoom.jl", "purplecreate.tramways.javazoom.jl")
}

sourceSets.main.resources {
  srcDir "src/generated/resources"
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = "UTF-8"
}

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
